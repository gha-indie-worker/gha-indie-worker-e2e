name: Oreslang source-free CI hardening probe

on:
  push:
    branches:
      - "oreslang-source-free-hardening-probe-*"
  pull_request:

permissions:
  contents: read

jobs:
  security-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact carrier revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "SOURCE_FREE_CARRIER_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Prove source-free private-CI security primitives
        shell: bash
        run: bash source-free-carrier/test-policy.sh
      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1
        with:
          distribution: graalvm
          java-version: '25'
      - name: Prove Java/Graal Native Image toolchain
        run: |
          set -euo pipefail
          java --version
          javac --version
          native-image --version
      - name: Prove native/LLVM/Forge and wasm32 object toolchains
        run: |
          set -euo pipefail
          g++ --version
          clang++ --version
          cmake --version
          printf '%s\n' 'int main(){return 0;}' > /tmp/probe.cpp
          clang++ -std=c++20 -Wall -Wextra -Werror /tmp/probe.cpp -o /tmp/probe
          /tmp/probe
          printf '%s\n' 'int answer(void){return 42;}' > /tmp/probe.c
          clang --target=wasm32 -c /tmp/probe.c -o /tmp/probe.wasm.o
          test -s /tmp/probe.wasm.o
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Prove .NET toolchain
        run: dotnet --info
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove Node/HDL toolchain
        run: node --version
      - name: Prove installed Rust toolchain
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
