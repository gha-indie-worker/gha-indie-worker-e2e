name: Oreslang source-free CI hardening probe

on:
  push:
    branches:
      - "oreslang-source-free-hardening-probe-*"
  pull_request:

permissions:
  contents: read

jobs:
  security-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact carrier revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "SOURCE_FREE_CARRIER_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Prove source-free private-CI security primitives
        shell: bash
        run: bash source-free-carrier/test-policy.sh
