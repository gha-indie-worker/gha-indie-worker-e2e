# Public, read-only exact-commit checkout. No cross-organization secrets or private source.
name: Pinned public CLI Cargo regression
on:
  pull_request:
    paths:
      - '.github/workflows/pinned-cli-cargo-regression.yml'
permissions:
  contents: read
jobs:
  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable public CLI snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: gha-indie-worker/gha-indie-worker-cli
          ref: 91751a64ebb8a9de8d8e8de09d593df963dd38fd
          path: public-cli
          persist-credentials: false
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-cli rev-parse HEAD)" = 91751a64ebb8a9de8d8e8de09d593df963dd38fd
          test "$(git -C public-cli hash-object src/args.rs)" = 390f8497817b6ddcf6395918dfdd9dc96cf71ea6
      - name: Execute locked Rust regression suite
        working-directory: public-cli
        run: cargo test --all-targets --locked
      - name: Clippy the public CLI, deny warnings
        working-directory: public-cli
        run: cargo clippy --all-targets --locked -- -D warnings
