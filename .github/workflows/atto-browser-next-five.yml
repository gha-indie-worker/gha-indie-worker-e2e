name: Atto browser exact public heads and compiler-backed Worker verification
on:
  push:
    branches: ['validation/atto-browser-next-five-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '19'
            head: 8e109b19d057ba3b6e55601ec4b788189e616ee8
            tree: 64c5128644709924a0c640e717c2c4b49578879c
          - pr: '28'
            head: b482c2a11d2edf76dffda58286da4184e1eab644
            tree: 62f9baa9b2e5e6b8f2c3a7af941d2a4eaa83cd14
          - pr: '29'
            head: 3b7aef012945c4df169a89f33f8adb634bee9ce1
            tree: bc3f1d4bf78ccd9d4c6f9ed3be0fe91818b1e99d
          - pr: '5'
            head: 961767a9f32453620f85a6d33326bc4850b4c825
            tree: b8fc4e18a2e3b91edd86b836becbb9f14962dde6
          - pr: '6'
            head: f8011ea314d384f4c77c9fe45d5e7dce4ddc4ab7
            tree: dcd2f5ff26ec642d2aa2766f6ab6b5bc9b547723
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch public immutable browser tree without credentials
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-browser.git "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TREE_SHA"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
      - name: Execute static source and portable native ABI checks
        working-directory: source
        run: |
          sh ci/check-source.sh
          sh tests/ci/test-mirror-identity.sh
          sh -n ci/verify-native.sh
          sh -n ci/verify-backend-ffi.sh
          sh ci/check-qt-ffi.sh
      - name: Execute complete Node suite
        working-directory: source
        run: npm test
      - name: Install pinned Chromium and Firefox harness
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Execute real browser Worker suite and JS tenant integration
        working-directory: source
        run: |
          npm run test:browser
          npm run test:browser-js
      - name: Build exact public Rust compiler trees and compile seven real guests
        if: matrix.pr == '5' || matrix.pr == '6'
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          checkout_compiler() {
            git init "$1"
            git -C "$1" -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-source.rs.git "$2"
            git -C "$1" checkout --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            test "$(git -C "$1" rev-parse HEAD^{tree})" = "$3"
            cargo build --release --locked --manifest-path "$1/Cargo.toml" --bin attoc
          }
          checkout_compiler rust-legacy 85b0d9443cf05a8d90f8a10c6066f96b881782c1 3c834705c64694d63e2fc78bbd8532dfdc1e3243
          checkout_compiler rust-receiver 8fc0439b20f6a754a1145a07191e6edfb648874f 146bf519e91f30d7f4875612400270d924d29766
          checkout_compiler rust-stateful e6dff1d9c292a7243e21df888c84b5f43b8816f0 9cc7076195f3ab69f04a9778b22147fba54ac7b2
          out="$RUNNER_TEMP/atto-browser-guests"
          mkdir -p "$out"
          bin=rust-legacy/target/release/attoc
          input=rust-legacy/tests/fixtures
          "$bin" "$input/pass/67-actor-two-instances.atto" -o "$out/two-actors.wasm"
          "$bin" "$input/pass/61-actor-state.atto" -o "$out/actor-state.wasm"
          "$bin" "$input/panic/10-actor-overflow.atto" -o "$out/actor-overflow.wasm"
          "$bin" "$input/browser/remote-actor-receiver.atto" -o "$out/remote-receiver.wasm"
          "$bin" "$input/browser/remote-actor-source-send.atto" -o "$out/remote-sender.wasm"
          rust-receiver/target/release/attoc --receiver-instance-preview source/tests/fixtures/receiver-worker.atto -o "$out/receiver-worker.wasm"
          rust-stateful/target/release/attoc --stateful-method-preview rust-stateful/tests/fixtures/stateful/counter.atto -o "$out/stateful-counter.wasm"
          sha256sum "$out"/*.wasm
      - name: Execute real compiled guest Worker integration
        if: matrix.pr == '5' || matrix.pr == '6'
        working-directory: source
        run: |
          export ATTO_BROWSER_FIXTURE_DIR="$RUNNER_TEMP/atto-browser-guests"
          npm run test:browser-tenants
          npm run test:browser-receiver
          npm run test:browser-stateful
