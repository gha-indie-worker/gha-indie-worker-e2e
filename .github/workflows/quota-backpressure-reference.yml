name: quota-backpressure-reference

on:
  pull_request:
    paths:
      - 'tests/quota_backpressure_reference.rs'
      - '.github/workflows/quota-backpressure-reference.yml'
      - 'quota-backpressure-source-identity.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
      - name: Verify source-free test blob identity
        run: test "$(git hash-object tests/quota_backpressure_reference.rs)" = "81734197bf0eb8bad1aba8a96986c097dc216085"
      - name: Compile and execute deterministic quota/backpressure model
        run: |
          mkdir -p target
          rustc --edition=2024 --test tests/quota_backpressure_reference.rs -o target/quota-backpressure-reference-test
          target/quota-backpressure-reference-test
