name: Oreslang failure effects mirror verification

on:
  push:
    branches: ["feat/oreslang-failure-effects-pr455-mirror"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and checkout immutable source tree
        run: |
          set -eu
          source_commit="fd548ce0b45861a2f275d5c93dd1326d6d0f8ede"
          actual_tree="$(git rev-parse "${source_commit}^{tree}")"
          echo "Mirror source tree: $actual_tree"
          test "$actual_tree" = '6e1e07c6076c9febb326e835b02e86078ebff8ae'
          git checkout --detach "$source_commit"
          test "$(git rev-parse 'HEAD^{tree}')" = '6e1e07c6076c9febb326e835b02e86078ebff8ae'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Compile and run targeted regressions
        run: mvn -B -ntp -Dtest=FailureEffectLanguageTest,ActorFailureIsolationTest,TrapOptionSemanticsTest test
