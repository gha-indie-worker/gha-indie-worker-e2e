name: PR459 exact recursive graph tests
on:
  push:
    branches:
      - test/oreslang-pr459-verified-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source tree
        run: |
          set -eu
          git checkout --detach 90fdbb425b8c6e2c5caeacf30315b59abd0535a7
          actual="$(git rev-parse 'HEAD^{tree}')"
          echo "mirror tree = $actual"
          test "$actual" = "b545cbf961b51c5c2efd1b0fee172d58e925fdbb"
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run focused recursive graph tests and regressions
        run: mvn -B -ntp -Dtest=RecursiveTypeGraphTest,BooleanTypeAliasTest,StaticStructAotTest,OptionResultSemanticsTest,ActorTransportHardeningTest,StructuralTypingHardeningTest test
