name: Atto ten runtime candidate qualifications
on:
  push:
    branches: [ci/atto-runtime-batch10-20261128]
permissions: {}
jobs:
  qualification:
    name: ${{ matrix.kind }}-PR-${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: java
            pr: 617
            head: d01d1582b493577c4d80aef65bd99a2af4e5b5e3
            tree: 0998b25cf6da0662e1eadc31880a1092c4431884
            tests: 'OresVMTest,NativeCarrierExecutorLazyStartupTest'
          - kind: java
            pr: 1560
            head: 586cf3deeb899e119751b1441690f0f4081595b9
            tree: 53ce159f0eec92c62a634375e9bc1f781891a259
            tests: 'ActorSupervisorControlLanePortTest,ActorSupervisorControlAtomicTransferTest,ActorSupervisorControlCounterSaturationTest,ActorSupervisorControlV2Test,ActorSupervisorControlConservationTest'
          - kind: java
            pr: 1869
            head: 6f68bdfa96361f61dc0c1ad32289881c8d0d0217
            tree: 2d6207a160daa93cdc6f464b35de04eef232c2be
            tests: 'AsyncTrapResultForwardPortTest,AsyncTrapResultCandidateTest,AttoStrictTrapSourceAdmissionTest,SourceTaskCancelTest'
          - kind: java
            pr: 1972
            head: 3af136796b329379c8f9dfe82c36d357dc212dd0
            tree: 79a053af889017414ab6ec775d286ffafe3d75c7
            tests: 'CheckedUnwrapPipelineExecutionTest'
          - kind: java
            pr: 950
            head: 402fba3420d1dc14ba82edead42ac1936a93d21b
            tree: 72a72e316709281bda2ee439485130c2a894907d
            tests: 'CriticalCarrierNonparkingTest'
          - kind: llvm
            pr: 573
            head: 9f763f2a09de647277f174e5a6cafa510862b096
            tree: e64a91756f6e87acbbeb016383a39e19ebaced89
            tests: ''
          - kind: llvm
            pr: 539
            head: ebae776d0b34e445e4f1189db23f87dd25a97ea5
            tree: 7d6903cd12921e3f7515847d29ce3c39e69b64bf
            tests: ''
          - kind: llvm
            pr: 751
            head: 5a4f2b4e84fe6ec7cc7e2ce7983fcb0f59a4690b
            tree: 4e9031f3e1e2f8789179e9e53ed45b8ee9f769fc
            tests: ''
          - kind: llvm
            pr: 1060
            head: a583ecbb88ebae402a65341655fa0718a66a302f
            tree: 9241d099371d2de7699812f3390620b08717aad9
            tests: ''
          - kind: llvm
            pr: 774
            head: 44d7b16f72df7881144f0100c2e2e563a9ed6a0a
            tree: a501b9bc937f85dfa082294c29ef7977d1bc5582
            tests: ''
    env:
      SOURCE_KIND: ${{ matrix.kind }}
      SOURCE_PR: ${{ matrix.pr }}
      SOURCE_HEAD: ${{ matrix.head }}
      SOURCE_TREE: ${{ matrix.tree }}
      JAVA_TESTS: ${{ matrix.tests }}
    steps:
      - name: Fetch pinned public Atto commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin "https://github.com/atto-lang/atto-source.$SOURCE_KIND.git"
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= fetch --depth=1 origin "$SOURCE_HEAD"
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
          echo "EXACT_HEAD=$SOURCE_HEAD EXACT_TREE=$SOURCE_TREE"
      - name: JVM runtime qualification and nonempty JUnit receipts
        if: matrix.kind == 'java'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_25_X64:-}" ] && [ -x "$JAVA_HOME_25_X64/bin/java" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            curl -fsSL --retry 3 'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jdk&os=linux&vendor=eclipse' > /tmp/jdk25.json
            link=$(jq -er '.[0].binary.package.link' /tmp/jdk25.json)
            checksum=$(jq -er '.[0].binary.package.checksum' /tmp/jdk25.json)
            [[ "$link" = https://github.com/adoptium/temurin25-binaries/releases/download/* ]]
            [[ "$checksum" =~ ^[a-fA-F0-9]{64}$ ]]
            curl -fsSL --retry 3 "$link" -o /tmp/jdk25.tar.gz
            echo "$checksum  /tmp/jdk25.tar.gz" | sha256sum -c -
            mkdir -p /tmp/atto-jdk25
            tar -xzf /tmp/jdk25.tar.gz --strip-components=1 -C /tmp/atto-jdk25
            export JAVA_HOME=/tmp/atto-jdk25
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          cd source
          if [[ "$SOURCE_PR" = 1560 ]]; then
            bash scripts/verify-supervisor-control-lane-port.sh
          else
            mvn -B -ntp "-Dtest=$JAVA_TESTS" -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
          fi
          IFS=, read -ra suites <<< "$JAVA_TESTS"
          for suite in "${suites[@]}"; do
            mapfile -t reports < <(find target/surefire-reports -maxdepth 1 -type f -name "TEST-*.$suite.xml")
            test "${#reports[@]}" -eq 1
            grep -Eq 'tests="[1-9][0-9]*"' "${reports[0]}"
            grep -q 'failures="0"' "${reports[0]}"
            grep -q 'errors="0"' "${reports[0]}"
            grep -q 'skipped="0"' "${reports[0]}"
            echo "EXECUTED_JUNIT_PASS $suite"
          done
      - name: LLVM exact source runtime tests
        if: matrix.kind == 'llvm'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          R=src/main/cpp/oreslang/runtime
          case "$SOURCE_PR" in
            573)
              rustc --edition=2021 -D warnings --test contracts/v2/test_continuation_locality_v1.rs -o /tmp/locality
              /tmp/locality
              for cc in gcc clang; do
                flags=(-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -pthread -Isrc/main/cpp)
                if [[ "$cc" = clang ]]; then flags+=(-g -fsanitize=address,undefined -fno-sanitize-recover=all); fi
                "$cc" "${flags[@]}" tests/native_continuation_ready_resume_test.c "$R/NativeExecutionContextStore.c" "$R/NativeContinuationStore.c" "$R/NativeAwaitTraceBridge.c" -o /tmp/continuation
                timeout 90 /tmp/continuation
                for test in native_actor_scheduler_test native_continuation_wake_escrow_test; do
                  "$cc" "${flags[@]}" "tests/$test.c" "$R/NativeActorScheduler.c" -o "/tmp/$test"
                  timeout 90 "/tmp/$test"
                done
              done
              ;;
            751)
              for cc in gcc clang; do
                flags=(-O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -pthread -Isrc/main/cpp)
                cxx=g++; if [[ "$cc" = clang ]]; then cxx=clang++; flags+=(-g -fsanitize=address,undefined -fno-sanitize-recover=all); fi
                "$cc" -std=c11 "${flags[@]}" -c "$R/NativeActorScheduler.c" -o /tmp/scheduler.o
                for test in native_actor_retained_data_ordering_test native_actor_retained_cleanup_unused_reservation_test native_actor_retained_cleanup_autoadmit_test native_actor_retained_data_stop_test native_actor_retained_stop_wake_race_test; do
                  "$cc" -std=c11 "${flags[@]}" "tests/$test.c" /tmp/scheduler.o -o "/tmp/$test"
                  timeout 120 "/tmp/$test"
                done
                for test in native_actor_execution_ledger_test native_actor_invocation_frames_test native_actor_ledger_scheduler_bridge_test native_actor_invocation_frame_bridge_test; do
                  "$cxx" -std=c++17 "${flags[@]}" "tests/$test.cpp" /tmp/scheduler.o -o "/tmp/$test"
                  timeout 90 "/tmp/$test"
                done
              done
              ;;
            1060)
              cargo test --locked --test owned_unwind_native -- --nocapture
              ;;
            539|774)
              llvm_cmake="$(find /usr/lib/llvm-* -path '*/lib/cmake/llvm/LLVMConfig.cmake' -print 2>/dev/null | sort -V | tail -1 || true)"
              if [[ -z "$llvm_cmake" ]]; then
                sudo apt-get update
                sudo apt-get install -y llvm-dev
                llvm_cmake="$(find /usr/lib/llvm-* -path '*/lib/cmake/llvm/LLVMConfig.cmake' -print | sort -V | tail -1)"
              fi
              test -f "$llvm_cmake"
              cmake -S . -B build/runtime-qualification -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLLVM_DIR="$(dirname "$llvm_cmake")"
              cmake --build build/runtime-qualification --target oreslang-llvmc -j 2
              if [[ "$SOURCE_PR" = 539 ]]; then
                for mode in normal sanitized; do
                  flags=(); if [[ "$mode" = sanitized ]]; then flags+=(--sanitize); fi
                  python3 tests/source_actor_e2e.py --compiler "$PWD/build/runtime-qualification/oreslang-llvmc" --clang "$(command -v clang)" --root "$PWD" --positive-case source-actor-heap-turnover.ores "${flags[@]}"
                done
              else
                cmake --build build/runtime-qualification --target oreslang-native-actor-owned-task-wake-test -j2
                ctest --test-dir build/runtime-qualification --output-on-failure --no-tests=error -R 'native_actor_owned_task_wake_host_v1|native_actor_task_.*compiled_producer_(ir|actor_wake)_o0_o2|native_actor_suspends_.*denied'
              fi
              ;;
            *) exit 1 ;;
          esac
          echo "EXECUTED_LLVM_SCOPE_PASS PR=$SOURCE_PR HEAD=$SOURCE_HEAD TREE=$SOURCE_TREE"
