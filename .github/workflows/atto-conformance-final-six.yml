name: Atto final conformance candidates with current baseline
on:
  push:
    branches: ['validation/atto-conformance-final-six-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 'baseline'
            head: 6ba9f4c31a035ebac74ff69487d1776a275d4fe8
            tree: 6f6371129e05160b43e72f2e79c337ec3472bda8
          - pr: '437'
            head: 701b2d5e85da2b660e475b29cbe7fd348a12482e
            tree: 8cf0ed3b08f7226c80c05c101dbce5d2a7cef458
          - pr: '392'
            head: 1c66ac1feae516a4382ef5d767bba4b4c6cb7c0a
            tree: 59cf8b047bd91dedd3436216697ed4d463fc11c5
          - pr: '389'
            head: c7e51a5d64334073b731314712ab85c447b086fb
            tree: 236895fd01b31c2e9503e4aeac7aed498a5955c9
          - pr: '398'
            head: b2b489eab9d2a4b658c27508da334f26e7ff3726
            tree: 63ad5ebebb013b54c17801bb09f27c35b377aab9
          - pr: '457'
            head: 8bc335d20f100b65391cf96f32f7a1e1f6ed7963
            tree: 136764cee522416cbe224f4c1328ac2be3498e8f
          - pr: '418'
            head: 958393922a63f96233e454ba6ca31dd390882ab6
            tree: 98c7064ffd1428d6cb10e17f58d1bbcc15389124
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch and verify exact public integration head and tree
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-platform-conformance.git "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TREE_SHA"
          test -z "$(git -C source status --porcelain)"
      - name: Execute PR-specific tests
        if: matrix.pr != 'baseline'
        working-directory: source
        env:
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          case "$PR" in
            437) node --test tests/import-root-plus-v1.test.mjs ;;
            392) node --test tests/atto-local-context-m2-contract-20261107.test.mjs tests/local-context-m2-evidence-20261107.test.mjs ;;
            389) node --test tests/nio-actor-parity-v1.test.mjs ;;
            398) node --test tests/actor-group-exact-head-evidence.test.mjs ;;
            457) node --test tests/tenant-broker-compiled-guest-v1.test.mjs ;;
            418) node --test test/strict-named-i64-real-node22.test.mjs test/strict-named-i64-receipt.test.mjs ;;
            *) exit 1 ;;
          esac
      - name: Execute full existing Node regression suite
        working-directory: source
        run: npm test
