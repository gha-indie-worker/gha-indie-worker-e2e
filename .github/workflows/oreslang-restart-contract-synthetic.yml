name: Oreslang restart contract synthetic

on:
  push:
    branches:
      - synthetic/oreslang-restart-contract-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout synthetic-only branch
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prove no private-source payload path exists
        shell: bash
        run: |
          set -euo pipefail
          test -f synthetic/OreslangRestartContractSynthetic.java
          test ! -e private-oreslang-source
          test ! -e oreslang-source.java
          grep -F 'source-free model; no private Oreslang source copied' synthetic/OreslangRestartContractSynthetic.java

      - name: Compile source-free contract model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetic-classes
          mkdir synthetic-classes
          javac -d synthetic-classes synthetic/OreslangRestartContractSynthetic.java

      - name: Execute generation and restart invariants
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -ea -cp synthetic-classes synthetic.OreslangRestartContractSynthetic)"
          printf '%s\n' "$output"
          grep -F 'SYNTHETIC CONTRACT: 12/12 invariants passed' <<<"$output"
          grep -F 'SOURCE_SHA=0343527520a5e2f2e160ce42894537daab48324b' <<<"$output"
          grep -F 'SOURCE_TREE=f7d57bc61c9d5210b7acff48fa05670271777c2f' <<<"$output"
          grep -F 'NOTE=source-free model; no private Oreslang source copied' <<<"$output"
