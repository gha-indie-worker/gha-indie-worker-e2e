name: Test CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest tests/test_deadlock.py tests/test_schedule.py -v
      - run: python bin/oreslang test --root . --race --trace tests/traces/ordered.jsonl
      - run: python bin/oreslang test --root . --race --logical --model tests/models/atomic-update.json
      - run: '! python bin/oreslang test --root . --race --trace tests/traces/racy.jsonl'
      - run: '! python bin/oreslang test --root . --race --logical --model tests/models/lost-update.json'
