name: Atto LLVM disjoint native domain IDs
on:
  push:
    branches: [ci/atto-runtime-462-20261127]
permissions: {}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact source allocator and exhaustion proof
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.llvm.git
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= fetch --depth=1 origin b257c1151939928239db432145422d773a8fd08a
          git -C source checkout -q --detach FETCH_HEAD
          cd source
          test "$(git rev-parse HEAD)" = b257c1151939928239db432145422d773a8fd08a
          test "$(git rev-parse 'HEAD^{tree}')" = 80c890a16e699229a557d1177b9d43bec35ec740
          R=src/main/cpp/oreslang/runtime
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -O2 -pthread -Isrc/main/cpp tests/native_actor_domain_id_test.c -o /tmp/domain
            timeout 90 /tmp/domain
            "$cc" -std=c11 -Wall -Wextra -Werror -O2 -pthread -Isrc/main/cpp tests/native_actor_domain_runtime_test.c "$R/ActorArena.c" "$R/ActorOwnedI64Heap.c" -o /tmp/runtime
            timeout 90 /tmp/runtime
          done
          clang -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -pthread -Isrc/main/cpp tests/native_actor_domain_runtime_test.c "$R/ActorArena.c" "$R/ActorOwnedI64Heap.c" -o /tmp/runtime-san
          timeout 90 /tmp/runtime-san
          echo DOMAIN_ID_PASS
