name: Atto native selectable send exact assertion
on:
  push:
    branches: [ci/atto-llvm-select-send-504-diagnostic-20261128]
permissions: {}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact head and execute native regression
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.llvm.git
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= fetch --depth=1 origin d20fabdef01ceb76ace5eeed2eb4c78a6a8a2b07
          git -C source checkout -q --detach FETCH_HEAD
          cd source
          test "$(git rev-parse HEAD)" = d20fabdef01ceb76ace5eeed2eb4c78a6a8a2b07
          test "$(git rev-parse 'HEAD^{tree}')" = 318a496cefaaaf29ed8825875ad799448a91ec1c
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -pthread -Isrc/main/cpp tests/native_selectable_send_admission_test.c src/main/cpp/oreslang/runtime/NativeActorScheduler.c -o /tmp/select-send
          timeout 120 /tmp/select-send
