name: Oreslang PR 435 exact compiler mirror

on:
  push:
    branches:
      - ci/oreslang-pr435-arguments-54cf2fe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact mirrored compiler objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:oreslang-mirror/src/main)" = "4db8b532c5e9332450bd3aea94e48ccb81126989"
          test "$(git hash-object oreslang-mirror/pom.xml)" = "5911f0a162da2820be499c8b5e98fdceb632afc5"
          test "$(git hash-object oreslang-mirror/src/test/java/dev/oreslang/ArgumentsTupleSpreadTest.java)" = "7376d6fd1a004fb3abc8bb6d80c87d2010266070"
          echo "exact source subtree and test blob verified"

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Run arguments tuple spread tests
        working-directory: oreslang-mirror
        run: mvn -B -ntp -Dtest=ArgumentsTupleSpreadTest test
