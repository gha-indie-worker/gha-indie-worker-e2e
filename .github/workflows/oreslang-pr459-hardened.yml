name: PR459 exact a3d0e5b recursive hardening suite
on:
  push:
    branches:
      - test/oreslang-pr459-hardened-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source tree
        run: |
          set -eu
          git checkout --detach 65cb3fcdc7d99f740f3c94746cb8ca7fb6962ec5
          actual="$(git rev-parse 'HEAD^{tree}')"
          test "$actual" = "485b94c8a304f76d6aad4ef7465c633e2086291e"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run recursive ownership and diagnostic tests
        run: mvn -B -ntp -Dtest=RecursiveTypeGraphTest,CycleSafeDisplayTest,OwnershipAndClosureTest,BooleanTypeAliasTest,StaticStructAotTest,OptionResultSemanticsTest,ActorTransportHardeningTest,StructuralTypingHardeningTest test
