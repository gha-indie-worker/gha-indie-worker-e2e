name: oreslang-gc-validation

on:
  push:
    branches: ["ci/oreslang-gc-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select JDK 21
        shell: bash
        run: |
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Java diagnostics
        run: |
          java --version
          mvn --version
      - name: Verify mirrored Oreslang branch
        working-directory: oreslang-ci
        run: mvn -B -ntp verify
