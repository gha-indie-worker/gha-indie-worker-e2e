name: Atto conformance baseline and two additional exact integration heads
on:
  push:
    branches: ['validation/atto-conformance-baseline-and-two-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 'baseline'
            head: a1c411c660d8d0dbf2fd7b2cc64c8d83d7aaf0d3
            tree: 0c8341e122e7645ee5ca849a072deb6ff7c3780b
          - pr: 'baseline-new'
            head: 44cf05d70e19b76a137076760b8fc66337f04c0c
            tree: e7b7fb053376a2f838a266ec7ebb34f9e2321101
          - pr: '499'
            head: aaa01654b2639acde401a636af74d230221207ef
            tree: 7227621add41b4d46bfb466400fb1419c0524a41
          - pr: '473'
            head: 119766ad17e2b32d0f11c9415df366d38eae979f
            tree: 7c83f8b3380516f8650a3d9d70eadd13016aa158
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch and verify exact public integration head and tree
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-platform-conformance.git "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TREE_SHA"
          test -z "$(git -C source status --porcelain)"
      - name: Execute PR-specific tests
        if: matrix.pr != 'baseline' && matrix.pr != 'baseline-new'
        working-directory: source
        env:
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          case "$PR" in
            499) node --test tests/otel-canonical-contract.test.mjs tests/otel-five-backend-evidence.test.mjs tests/otel-real-guest-config.test.mjs ;;
            473) node --test tests/singleton-domain-operational-model.test.mjs tests/singleton-shared-parity-v2.test.mjs tests/singleton-symbol-shared-domain-v1.test.mjs ;;
            *) exit 1 ;;
          esac
      - name: Execute full existing Node regression suite
        working-directory: source
        run: npm test
