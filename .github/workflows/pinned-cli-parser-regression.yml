# Read-only exact-commit testing of the public CLI parser on an independently scheduled runner.
# No private sources, tokens beyond contents:read, Docker, or secret access.
name: Pinned public CLI parser regression
on:
  pull_request:
    paths:
      - '.github/workflows/pinned-cli-parser-regression.yml'
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact public CLI commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: gha-indie-worker/gha-indie-worker-cli
          ref: 91751a64ebb8a9de8d8e8de09d593df963dd38fd
          path: public-cli
          persist-credentials: false
      - name: Verify immutable commit and exact Rust source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-cli rev-parse HEAD)" = 91751a64ebb8a9de8d8e8de09d593df963dd38fd
          test "$(git -C public-cli hash-object src/args.rs)" = 390f8497817b6ddcf6395918dfdd9dc96cf71ea6
      - name: Compile and execute production parser's Rust unit tests without remote dependencies
        working-directory: public-cli
        shell: bash
        run: |
          set -euo pipefail
          cat > cli_parser_fixture.rs <<'RS'
          #![forbid(unsafe_code)]
          mod error {
              #[derive(Debug)]
              pub enum CliError {
                  Usage(String),
              }
          }
          #[path = "src/args.rs"]
          mod args;
          RS
          rustc --edition=2021 --test cli_parser_fixture.rs -o "$RUNNER_TEMP/cli_parser_tests"
          "$RUNNER_TEMP/cli_parser_tests" --nocapture
      - name: Validate exact public source formatting
        working-directory: public-cli
        run: rustfmt --edition 2021 --check src/args.rs src/config.rs
