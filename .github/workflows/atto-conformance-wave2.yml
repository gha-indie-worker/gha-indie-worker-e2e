name: Atto conformance second wave
on:
  push:
    branches: ['validation/atto-conformance-wave2-20261125-1224']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 'baseline'
            head: ffab0f8ed70137427896cf073a95225cf318847f
          - pr: '503'
            head: a1b2cf3587ed4b1395fd161498cf044ec0b44f1b
          - pr: '524'
            head: f27b781470fbcd2db588ceab6195faffd544adb4
          - pr: '541'
            head: d122af5b91dc6e5309f8c9f404eba677c6033428
          - pr: '500'
            head: 56610147c581ed987911a361639a00c4f3d3d047
          - pr: '484'
            head: 5d1cebfbf7d239124c40e097c5f286779ce6c57e
          - pr: '461'
            head: 0ec0accb521345e9fc7939d77c99b47c88932530
          - pr: '454'
            head: a5dbc4e322259a39907bb1040b549cd9f32a7581
          - pr: '440'
            head: 06a263b64c67b7f26ec3fb53d73efe2c870a2a31
          - pr: '393'
            head: 1e744a76d5c1aa0c581884d328300b00d9f7013b
          - pr: '591'
            head: 6100366310f8caf58b34ca626c64a16d2b2e8514
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned public source and integration
        env:
          HEAD_SHA: ${{ matrix.head }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git ffab0f8ed70137427896cf073a95225cf318847f "$HEAD_SHA"
          git -C source checkout --detach ffab0f8ed70137427896cf073a95225cf318847f
          git -C source -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff "$HEAD_SHA"
          echo "BASE=ffab0f8ed70137427896cf073a95225cf318847f HEAD=$HEAD_SHA TREE=$(git -C source write-tree)"
      - name: Execute focused candidate tests
        if: matrix.pr != 'baseline'
        working-directory: source
        env:
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          case "$PR" in
            503) python3 contracts/source-parity/check_five_backend_shared_contract_shas.py --self-test ;;
            524) node --test test/actor-fault-claim-v1.test.mjs ;;
            541) node --test test/lambda-v1-manifest.test.mjs test/lambda-v1-python.test.mjs ;;
            500) node --test tests/borrow-mir-v1-contract.test.mjs ;;
            484) node --test test/erl-otp-strict-aot-contract.test.mjs test/erl-otp-strict-aot-receipt.test.mjs ;;
            461) node --test tests/actor-heap-hole-reuse-v1.test.mjs tests/actor-heap-physical-growth-peak-v1.test.mjs tests/actor-heap-ref32-growth-v1.test.mjs tests/hybrid-actor-memory-source-fixture-v1.test.mjs tests/hybrid-actor-memory-v1.test.mjs tests/hybrid-memory-host-evidence-20261121.test.mjs ;;
            454) node --test tests/enum-semantics-v1-mutations.test.mjs tests/enum-semantics-v1.test.mjs tests/enum-semantics-v2-six-backend.test.mjs ;;
            440) node --test tests/host-interop-v0.test.mjs ;;
            393) node --test tests/spec-audit-candidate-v1.test.mjs tests/spec-audit-compiler-adapter.test.mjs tests/spec-audit-github-evidence.test.mjs tests/spec-audit-guest-evidence.test.mjs ;;
            591) node --test tests/static-import-v2-corpus.test.mjs ;;
            *) exit 1 ;;
          esac
      - name: Full regression suite
        if: success() || failure()
        working-directory: source
        run: |
          test -z "$(git ls-files -u)"
          npm test
