name: Source-free native indexed-ready reference
on:
  push:
    branches: [ci/oreslang-sourcefree-admission-matrix-20261019]
    paths:
      - 'sourcefree-oreslang-ci-20261019/native-index-reference.c'
      - '.github/workflows/sourcefree-native-index-reference.yml'
  pull_request:
    paths:
      - 'sourcefree-oreslang-ci-20261019/native-index-reference.c'
      - '.github/workflows/sourcefree-native-index-reference.yml'
permissions:
  contents: read
jobs:
  reference-c11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitize: [none, undefined]
        exclude:
          - compiler: gcc
            sanitize: undefined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm public source-free-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gha-indie-worker/gha-indie-worker-e2e"
          test -f sourcefree-oreslang-ci-20261019/native-index-reference.c
          ! grep -E '^[[:space:]]*#include[[:space:]]*"oreslang/' sourcefree-oreslang-ci-20261019/native-index-reference.c
      - name: Compile and execute independent C11 reference
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          SAN: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$SAN" == undefined ]]; then
            flags+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
          fi
          "$CC" -std=c11 -O1 -g -UNDEBUG -Wall -Wextra -Wpedantic -Werror \
            "${flags[@]}" sourcefree-oreslang-ci-20261019/native-index-reference.c \
            -o /tmp/sourcefree-native-index-reference
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            /tmp/sourcefree-native-index-reference
