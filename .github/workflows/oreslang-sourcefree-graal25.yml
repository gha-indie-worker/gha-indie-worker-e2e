name: Source-free GraalVM JDK 25 toolchain canary

on:
  push:
    branches:
      - ci/source-free-graalvm25-toolchain-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-free-graalvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install GraalVM JDK 25 via pinned first-party setup-java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          java-version: '25'
          distribution: graalvm
      - name: Record toolchain and require JDK 25
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          mvn -version
          native-image --version
          java -XshowSettings:properties -version 2>&1 | grep -Eq 'java\.version = 25([.+-]|$)'
      - name: Compile and execute synthetic Maven and JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/graal25-source-free"
          mkdir -p "$work/src/main/java" "$work/src/test/java"
          cat > "$work/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.synthetic</groupId>
            <artifactId>graal25-capacity-canary</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>25</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>org.junit.jupiter</groupId>
                <artifactId>junit-jupiter</artifactId>
                <version>5.11.4</version>
                <scope>test</scope>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.0</version>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-surefire-plugin</artifactId>
                  <version>3.5.2</version>
                </plugin>
              </plugins>
            </build>
          </project>
          POM
          cat > "$work/src/main/java/ToolchainProbe.java" <<'JAVA'
          public final class ToolchainProbe {
              public static long add(long a, long b) { return Math.addExact(a, b); }
              public static void main(String[] args) {
                  if (args.length == 1 && "--i64".equals(args[0])) {
                      I64Oracle.main(args);
                      return;
                  }
                  if (args.length != 0 || Runtime.version().feature() != 25 || add(7, 2) != 9L) {
                      throw new AssertionError("wrong JDK or arithmetic");
                  }
                  System.out.println("SOURCE_FREE_GRAAL25_JAVA_PASS");
              }
          }
          JAVA
          cat > "$work/src/main/java/I64Oracle.java" <<'JAVA'
          import java.util.function.LongSupplier;
          public final class I64Oracle {
              private static String checked(LongSupplier f) {
                  try { return Long.toString(f.getAsLong()); }
                  catch (ArithmeticException overflow) { return "OVERFLOW"; }
              }
              private static String checkedDivide(long a, long b) {
                  if (a == Long.MIN_VALUE && b == -1L) return "OVERFLOW";
                  return checked(() -> a / b);
              }
              private static void output(String id, String value) {
                  System.out.println(id + "\t" + value);
              }
              public static void main(String[] args) {
                  if (args.length != 1 || !"--i64".equals(args[0]))
                      throw new IllegalArgumentException("i64-only mode");
                  long lo = Long.MIN_VALUE, hi = Long.MAX_VALUE;
                  output("p01", checked(() -> Math.addExact(hi, 1L)));
                  output("p02", checked(() -> Math.addExact(lo, -1L)));
                  output("p03", checked(() -> Math.subtractExact(lo, 1L)));
                  output("p04", checked(() -> Math.subtractExact(hi, -1L)));
                  output("p05", checked(() -> Math.multiplyExact(hi, 2L)));
                  output("p06", checked(() -> Math.multiplyExact(lo, -1L)));
                  output("p07", checked(() -> Math.addExact(lo, hi)));
                  output("p08", checked(() -> Math.subtractExact(lo, lo)));
                  output("p09", checked(() -> Math.multiplyExact(-3037000499L, 3037000499L)));
                  output("p10", checkedDivide(lo, -1L));
                  output("p11", checkedDivide(lo, 1L));
                  output("p12", Long.toString(hi + 1L));
                  output("p13", Long.toString(hi * 2L));
                  output("p14", Long.toString(-1L >> 1));
                  output("p15", Long.toString(-1L >>> 1));
                  String literal;
                  try { literal = Long.toString(Long.parseLong("9223372036854775808")); }
                  catch (NumberFormatException overflow) { literal = "INVALID"; }
                  output("p16", literal);
              }
          }
          JAVA
          cat > "$work/src/test/java/ToolchainProbeTest.java" <<'JAVA'
          import static org.junit.jupiter.api.Assertions.*;
          import org.junit.jupiter.api.Test;
          class ToolchainProbeTest {
              @Test void java25AndCheckedArithmetic() {
                  assertEquals(25, Runtime.version().feature());
                  assertEquals(9L, ToolchainProbe.add(7L, 2L));
              }
              @Test void overflowsRejectRatherThanWrap() {
                  assertThrows(ArithmeticException.class, () -> ToolchainProbe.add(Long.MAX_VALUE, 1L));
              }
          }
          JAVA
          mvn -B -ntp -f "$work/pom.xml" clean test
          grep -q 'tests="2"' "$work/target/surefire-reports/TEST-ToolchainProbeTest.xml"
          java -cp "$work/target/classes" ToolchainProbe | grep -Fx SOURCE_FREE_GRAAL25_JAVA_PASS
          echo "SOURCE_FREE_MAVEN_JUNIT_PASS tests=2"
      - name: Independently compare complete JS BigInt and JDK25 i64 values
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/graal25-source-free"
          node --input-type=module > "$work/js-i64.tsv" <<'JS'
          const lo = -(1n<<63n), hi = (1n<<63n)-1n;
          const checked = n => n<lo || n>hi ? "OVERFLOW" : n.toString();
          const wrap = n => BigInt.asIntN(64,n).toString();
          const tests = [
            ["p01",checked(hi+1n)], ["p02",checked(lo-1n)],
            ["p03",checked(lo-1n)], ["p04",checked(hi+1n)],
            ["p05",checked(hi*2n)], ["p06",checked(lo*-1n)],
            ["p07",checked(lo+hi)], ["p08",checked(lo-lo)],
            ["p09",checked(-3037000499n*3037000499n)],
            ["p10",checked(lo/-1n)], ["p11",checked(lo/1n)],
            ["p12",wrap(hi+1n)], ["p13",wrap(hi*2n)],
            ["p14",(-1n>>1n).toString()],
            ["p15",(BigInt.asUintN(64,-1n)>>1n).toString()],
            ["p16", "9223372036854775808" === hi.toString() ? "INVALID_FIXTURE" : "INVALID"],
          ];
          if (tests.length !== 16 || new Set(tests.map(x=>x[0])).size !== 16) throw new Error("invalid i64 suite");
          for (const [id,value] of tests) console.log(id+"\t"+value);
          JS
          java -cp "$work/target/classes" ToolchainProbe --i64 > "$work/java-i64.tsv"
          diff -u "$work/js-i64.tsv" "$work/java-i64.tsv"
          cp "$work/js-i64.tsv" "$work/invalid-i64.tsv"
          printf 'extra-unexpected-row\n' >> "$work/invalid-i64.tsv"
          if diff -q "$work/java-i64.tsv" "$work/invalid-i64.tsv"; then
            echo "::error::i64 comparator incorrectly accepted extra record"
            exit 1
          fi
          echo "SOURCE_FREE_JS_JAVA_I64_VALUES_PASS count=16"
      - name: Compile and execute actual GraalVM Native Image
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/graal25-source-free"
          native-image --no-fallback -cp "$work/target/classes" -o "$work/probe-native" ToolchainProbe
          "$work/probe-native" | grep -Fx SOURCE_FREE_GRAAL25_JAVA_PASS
          "$work/probe-native" --i64 > "$work/native-i64.tsv"
          diff -u "$work/js-i64.tsv" "$work/native-i64.tsv"
          diff -u "$work/java-i64.tsv" "$work/native-i64.tsv"
          sha256sum "$work/js-i64.tsv" "$work/java-i64.tsv" "$work/native-i64.tsv"
          echo "SOURCE_FREE_JS_JAVA_NATIVE_I64_VALUES_PASS count=16"
          echo "SOURCE_FREE_GRAAL25_NATIVE_IMAGE_PASS"
