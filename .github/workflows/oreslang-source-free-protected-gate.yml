name: Oreslang source-free protected gate

on:
  push:
    branches:
      - audit/oreslang-source-free-protected-gate-20261025
  pull_request:
    paths:
      - 'synthetic/oreslang_source_free_gate_test.py'
      - '.github/workflows/oreslang-source-free-protected-gate.yml'

permissions:
  contents: read

jobs:
  source-free-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove checkout contains no private Oreslang payload path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e private-oreslang-source
          test ! -e mirror
      - name: Run synthetic protected-gate truth table
        run: python3 synthetic/oreslang_source_free_gate_test.py
