name: Atto conformance baseline and two additional exact integration heads
on:
  push:
    branches: ['validation/atto-conformance-otel-retest-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '499'
            head: a811c495d011c34a70619380b432adeee97d42dc
            tree: c7299de8cb30f8e8a8ca95bd4531f317ef018597
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch and verify exact public integration head and tree
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-platform-conformance.git "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TREE_SHA"
          test -z "$(git -C source status --porcelain)"
      - name: Execute PR-specific tests
        if: matrix.pr != 'baseline' && matrix.pr != 'baseline-new'
        working-directory: source
        env:
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          case "$PR" in
            499) node --test tests/otel-canonical-contract.test.mjs tests/otel-five-backend-evidence.test.mjs tests/otel-real-guest-config.test.mjs ;;
            *) exit 1 ;;
          esac
      - name: Execute full existing Node regression suite
        working-directory: source
        run: npm test
