name: Proxy rollback ownership oracle

on:
  push:
    branches:
      - audit/proxy-rollback-owner-oracle-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk25-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile source-free oracle
        run: |
          mkdir -p build/proxy-rollback-oracle
          javac --release 25 -Xlint:all -Werror \
            -d build/proxy-rollback-oracle \
            src/test-oracles/ProxyRollbackOwnershipOracle.java
      - name: Execute source-free oracle
        run: |
          java -cp build/proxy-rollback-oracle ProxyRollbackOwnershipOracle
