# Exact public CLI commit; generate reproducible lock input without secrets or writes to source.
name: Pinned CLI lockfile regeneration evidence
on:
  pull_request:
    paths:
      - '.github/workflows/pinned-cli-lockfile-evidence.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact public CLI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: gha-indie-worker/gha-indie-worker-cli
          ref: 91751a64ebb8a9de8d8e8de09d593df963dd38fd
          path: public-cli
          persist-credentials: false
      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-cli rev-parse HEAD)" = 91751a64ebb8a9de8d8e8de09d593df963dd38fd
          test "$(git -C public-cli hash-object Cargo.lock)" = b3b61cbca489a747d85b64ff2ac03d792cf1d27c
      - name: Re-resolve the exact manifest and record generated lockfile
        working-directory: public-cli
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo LOCKFILE_B64_START
          base64 -w 0 Cargo.lock
          echo
          echo LOCKFILE_B64_END
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
