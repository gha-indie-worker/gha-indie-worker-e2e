name: Oreslang format PR34 exact-tree validation
on:
  push:
    branches:
      - tmp/oreslang-format-pr34-exact-20261019
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source tree
        run: test "$(git rev-parse HEAD^{tree})" = "71ed6ca7b188a35caf700eb21283e9e76d469d60"
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Tests
        run: cargo +1.85.0 test --all-targets
      - name: Clippy
        run: cargo +1.85.0 clippy --all-targets -- -D warnings
