name: AttoLang source-free runner admission canary
on:
  push:
    branches:
      - ci/atto-ownership-runner-canary-20261102
    paths:
      - .github/workflows/atto-ownership-source-free-runner-canary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-runner-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify isolated source-free runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "gha-indie-worker/gha-indie-worker-e2e"
          test "${GITHUB_REF_NAME}" = "ci/atto-ownership-runner-canary-20261102"
          test ! -d .git
          echo "ATTO_CANARY_SOURCE_TRANSFER=none"
          echo "ATTO_CANARY_NO_CHECKOUT=true"
          echo "ATTO_CANARY_RUN_ID=${GITHUB_RUN_ID}"
          echo "ATTO_CANARY_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
      - name: Execute source-free synthetic contract checks
        shell: bash
        run: |
          set -euo pipefail
          actual="oreslang-llvmc: native rt mut share requires verified SharedMutex<T> capability, guarded lowering and allocation-domain proof; refusing unsynchronized alias at byte 49"
          [[ "$actual" =~ ^oreslang-llvmc:\ native\ rt\ mut\ share\ requires\ verified\ SharedMutex\<T\>\ capability,\ guarded\ lowering\ and\ allocation-domain\ proof\;\ refusing\ unsynchronized\ alias\ at\ byte\ [0-9]+$ ]]
          [[ "$actual" != *$'\n'* ]]
          echo "ATTO_CANARY_SYNTHETIC_CHECKS=2"
          echo "ATTO_CANARY_NATIVE_COMPILER_EXECUTED=false"
      - name: Compile and execute source-free native Rust and C smoke
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cmake --version | head -1
          clang --version | head -1
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          printf 'fn main() { assert_eq!(6 * 7, 42); println!("RUST_SOURCE_FREE_NATIVE_PASS"); }\n' > "$dir/smoke.rs"
          rustc --edition=2021 -O "$dir/smoke.rs" -o "$dir/smoke-rust"
          "$dir/smoke-rust"
          printf '#include <stdio.h>\nint main(void) { puts("CLANG_SOURCE_FREE_NATIVE_PASS"); return 0; }\n' > "$dir/smoke.c"
          clang -O2 "$dir/smoke.c" -o "$dir/smoke-c"
          "$dir/smoke-c"
          echo "ATTO_CANARY_PRIVATE_COMPILER_EXECUTED=false"
          echo "ATTO_CANARY_PUBLIC_SOURCE_ONLY=true"

      - name: Execute independent synthetic Rust denial-oracle tests
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cat > "$scratch/oracle.rs" <<'RUST'
          // Source-free oracle model: this does NOT compile private AttoLang code.
          fn accepts(exit_code: i32, stdout: &str, stderr: &str) -> bool {
              if exit_code != 1 || !stdout.is_empty() { return false; }
              let mut lines = stderr.lines();
              let first = match lines.next() { Some(line) => line, None => return false };
              if lines.next().is_some() { return false; }
              let offset = match first.strip_prefix("ownership capability denial at byte ") {
                  Some(value) => value,
                  None => return false
              };
              !offset.is_empty() && offset.bytes().all(|b| b.is_ascii_digit())
          }
          #[test] fn normal_denial() {
              assert!(accepts(1, "", "ownership capability denial at byte 49\n"));
          }
          #[test] fn no_terminating_newline() {
              assert!(accepts(1, "", "ownership capability denial at byte 49"));
          }
          #[test] fn mismatched_exit_status() {
              assert!(!accepts(2, "", "ownership capability denial at byte 49"));
          }
          #[test] fn stdout_leak() {
              assert!(!accepts(1, "define i64 @main() {", "ownership capability denial at byte 49"));
          }
          #[test] fn extra_error_line() {
              assert!(!accepts(1, "", "ownership capability denial at byte 49\nunexpected parser error\n"));
          }
          #[test] fn same_line_spoof() {
              assert!(!accepts(1, "", "ownership capability denial at byte 49; unrelated failure"));
          }
          #[test] fn malformed_offset() {
              assert!(!accepts(1, "", "ownership capability denial at byte X49"));
          }
          #[test] fn empty_offset() {
              assert!(!accepts(1, "", "ownership capability denial at byte "));
          }
          #[test] fn missing_ownership_diagnostic() {
              assert!(!accepts(1, "", "usage error at byte 49"));
          }
          RUST
          rustc --edition=2021 --test "$scratch/oracle.rs" -o "$scratch/oracle-tests"
          "$scratch/oracle-tests" --nocapture
          echo "ATTO_CANARY_SOURCE_FREE_RUST_TESTS=9"
          echo "ATTO_CANARY_PRIVATE_SOURCE_BYTES=0"
