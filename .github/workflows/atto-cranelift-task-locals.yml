name: Atto public Cranelift exact task locals
on:
  push:
    branches: [ci/atto-cranelift-public-task-locals-20261125]
permissions: {}
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Pin public source identity and toolchain
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.cranelift.git
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= fetch --depth=1 origin d5978cf4f714754279d9cba2b0b6405b1ec00d71
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = d5978cf4f714754279d9cba2b0b6405b1ec00d71
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 30e323934741e6ab61980e441fcb652f17c5fc8b
          test -z "$(git -C source status --porcelain)"
          git -C source log -1 --format='%H %T'
      - name: Real Cranelift JIT guest execution
        run: |
          set -euo pipefail
          cd source
          cargo test --locked --test inline_sync_task -- --nocapture
      - name: Full regression and lint
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd source
          cargo test --locked --all-targets --no-fail-fast
          cargo clippy --locked --all-targets -- -D warnings
