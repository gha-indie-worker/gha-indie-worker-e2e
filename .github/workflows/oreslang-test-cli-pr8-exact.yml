name: Oreslang test CLI PR8 exact-tree validation
on:
  push:
    branches:
      - tmp/oreslang-test-cli-pr8-exact-20261019
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17beb571f943b7ae35e6e087f749bda8d05cae54
          persist-credentials: false
      - name: Verify exact source tree
        run: |
          test "$(git rev-parse HEAD)" = "17beb571f943b7ae35e6e087f749bda8d05cae54"
          test "$(git rev-parse HEAD^{tree})" = "22548c465d521c3c961a65da7cc15aa58a2eb5e3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest tests/test_deadlock.py tests/test_schedule.py -v
      - run: python bin/oreslang test --root . --race --trace tests/traces/ordered.jsonl
      - run: python bin/oreslang test --root . --race --logical --model tests/models/atomic-update.json
      - run: '! python bin/oreslang test --root . --race --trace tests/traces/racy.jsonl'
      - run: '! python bin/oreslang test --root . --race --logical --model tests/models/lost-update.json'
