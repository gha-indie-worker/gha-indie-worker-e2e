name: Oreslang hot-upgrade source-free oracle

on:
  push:
    branches:
      - 'tmp/oreslang-hot-upgrade-oracle-20261019'
    paths:
      - 'tmp/oreslang-hot-upgrade-oracle/**'
      - '.github/workflows/oreslang-hot-upgrade-oracle.yml'
  pull_request:
    paths:
      - 'tmp/oreslang-hot-upgrade-oracle/**'
      - '.github/workflows/oreslang-hot-upgrade-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile with warnings as errors
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/HotUpgradeInvariantOracle.java
      - name: Run lifecycle oracle
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle HotUpgradeInvariantOracle
      - name: Compile independent admission lease oracle
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/AdmissionLeaseOracle.java
      - name: Run admission lease race oracle
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle AdmissionLeaseOracle
      - name: Compile source-free candidate quarantine oracle
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/CandidateQuarantineOracle.java
      - name: Run candidate quarantine and physical release oracle
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle CandidateQuarantineOracle
      - name: Compile source-free proxy rollback oracle
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/ProxyRollbackOracle.java
      - name: Run proxy freeze rollback recovery race oracle
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle ProxyRollbackOracle
      - name: Compile source-free ghost child lifetime oracle
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/GhostChildLifetimeOracle.java
      - name: Run ghost child lifecycle fault oracle
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle GhostChildLifetimeOracle
      - name: Compile source-free pre-return transfer freeze oracle
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/TransferFreezeOracle.java
      - name: Run pre-return transfer freeze and retirement races
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle TransferFreezeOracle
