name: Oreslang hot-upgrade source-free oracle

on:
  push:
    branches:
      - 'tmp/oreslang-hot-upgrade-oracle-20261019'
    paths:
      - 'tmp/oreslang-hot-upgrade-oracle/**'
      - '.github/workflows/oreslang-hot-upgrade-oracle.yml'
  pull_request:
    paths:
      - 'tmp/oreslang-hot-upgrade-oracle/**'
      - '.github/workflows/oreslang-hot-upgrade-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile with warnings as errors
        run: javac --release 25 -Xlint:all -Werror tmp/oreslang-hot-upgrade-oracle/HotUpgradeInvariantOracle.java
      - name: Run lifecycle oracle
        run: java -ea -cp tmp/oreslang-hot-upgrade-oracle HotUpgradeInvariantOracle
