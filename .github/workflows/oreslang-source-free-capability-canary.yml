name: Source-free private-runner capability boundary canary
on:
  push:
    branches:
      - 'ci/source-free-capability-boundary-*'
permissions:
  contents: read
jobs:
  verify-kernel-capability-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attest actual systemd process limits and all Linux capability sets
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --uid 23145 --no-create-home --shell /usr/sbin/nologin ores-ci-cap-probe
          unit="oreslang-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$unit" =~ ^oreslang-private-[0-9]+-[0-9]+$ ]]
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="$unit" --uid=ores-ci-cap-probe \
            --working-directory=/tmp \
            --property=MemoryMax=268435456 \
            --property=MemorySwapMax=0 \
            --property=LimitNOFILE=1024 \
            --property=LimitCORE=0 \
            --property=TasksMax=16 \
            --property=CPUQuota=100% \
            --property=KillMode=control-group \
            --property=CapabilityBoundingSet= \
            --property=AmbientCapabilities= \
            --property=NoNewPrivileges=yes \
            /usr/bin/python3 -c '
          import os
          import resource
          from pathlib import Path
          uids, gids, extra = os.getresuid(), os.getresgid(), os.getgroups()
          assert uids == (23145, 23145, 23145), "real/effective/saved UID not confined"
          assert gids[0] != 0 and gids == (gids[0],) * 3, "GID credentials not confined"
          assert all(g == gids[0] for g in extra), "supplementary group escapes primary"
          status = dict(line.split(":", 1) for line in
                        Path("/proc/self/status").read_text().splitlines() if ":" in line)
          assert status["NoNewPrivs"].strip() == "1", "privilege escalation allowed"
          for key in ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb"):
              assert int(status[key].strip(), 16) == 0, "unexpected capability " + key
          group = Path("/proc/self/cgroup").read_text().strip().split("::", 1)[1]
          assert group.startswith("/system.slice/oreslang-private-"), "wrong cgroup"
          root = Path("/sys/fs/cgroup") / group.lstrip("/")
          assert 0 < int((root / "memory.max").read_text()) <= 268435456
          assert 0 < int((root / "pids.max").read_text()) <= 16
          assert (root / "memory.swap.max").read_text().strip() == "0", "swap not disabled"
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          assert 0 < soft <= 1024 and 0 < hard <= 1024, "open-file limits not bounded"
          assert resource.getrlimit(resource.RLIMIT_CORE) == (0, 0), "core dumps not denied"
          quota, period = (root / "cpu.max").read_text().split()
          assert 0 < int(quota) <= int(period), "missing CPU quota"
          print("SOURCE_FREE_CAPABILITY_BOUNDARY_PASS", flush=True)
          print("SOURCE_FREE_UID_GID_CREDENTIALS_PASS", flush=True)
          print("SOURCE_FREE_SWAP_NOFILE_BOUNDARY_PASS", flush=True)
          print("SOURCE_FREE_CORE_DUMP_DENIED_PASS", flush=True)
          '
      - name: Source-free negative tests for mixed guest identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          def admit(uids, gids, supplementary, expected=23145):
              return (uids == (expected, expected, expected)
                      and len(gids) == 3
                      and gids[0] != 0
                      and gids == (gids[0],) * 3
                      and all(g == gids[0] for g in supplementary))

          assert admit((23145,) * 3, (23145,) * 3, [])
          assert admit((23145,) * 3, (23145,) * 3, [23145])
          bad = (
              ((23145, 0, 23145), (23145,) * 3, []),
              ((23145, 23145, 0), (23145,) * 3, []),
              ((0, 23145, 23145), (23145,) * 3, []),
              ((23145,) * 3, (0, 23145, 23145), []),
              ((23145,) * 3, (23145, 0, 23145), []),
              ((23145,) * 3, (23145, 23145, 0), []),
              ((23145,) * 3, (23145, 23146, 23145), []),
              ((23145,) * 3, (23145,) * 3, [0]),
              ((23145,) * 3, (23145,) * 3, [27]),
          )
          assert all(not admit(*case) for case in bad)
          print("SOURCE_FREE_UID_GID_NEGATIVE_CASES_PASS")
          PY
      - name: Source-free resource budget denial matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          def admit(swap, nofile, core):
              soft, hard = nofile
              return (swap == "0"
                      and 1 <= soft <= 4096
                      and 1 <= hard <= 4096
                      and soft <= hard
                      and core == (0, 0))

          assert admit("0", (4096, 4096), (0, 0))
          bad = (
              ("max", (4096, 4096), (0, 0)),
              ("1024", (4096, 4096), (0, 0)),
              ("", (4096, 4096), (0, 0)),
              ("0", (4096, 1000000), (0, 0)),
              ("0", (5000, 5000), (0, 0)),
              ("0", (0, 4096), (0, 0)),
              ("0", (4096, 1024), (0, 0)),
              ("0", (4096, 4096), (0, 1048576)),
              ("0", (4096, 4096), (1024, 1024)),
          )
          assert all(not admit(*case) for case in bad)
          print("SOURCE_FREE_RESOURCE_DENIAL_MATRIX_PASS")
          PY
