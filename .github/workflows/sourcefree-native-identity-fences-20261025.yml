name: Source-free native identity fences

on:
  push:
    branches:
      - audit/source-free-actor-ref-rt-bootstrap-20261025
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-identity-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: No private Oreslang payload
        shell: bash
        run: |
          set -euo pipefail
          test ! -e private-oreslang-source
          echo "private_source_bytes=0"
          echo "model_for_llvm_nio_head=5024875f2acafe0ca2822107775efacaf4363eb5"
          echo "model_for_llvm_envelope_head=a0ddf7216bccfc2be95dbd438e0ee36e03a84b79"
      - name: Build and run scheduler identity model
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sourcefree-native-identity"
          mkdir -p "$work"
          cat > "$work/model.cpp" <<'CPP'
          #include <atomic>
          #include <cstdint>
          #include <cstdlib>
          #include <iostream>
          #include <limits>
          #include <memory>
          #include <map>
          #include <utility>

          struct ActorRef {
              std::uint64_t scheduler_domain{};
              std::uint64_t actor_slot{};
              std::uint64_t generation{};
          };

          struct Scheduler {
              std::uint64_t domain{};
              bool actor_live{true};
          };

          struct Ticket {
              Scheduler* scheduler{};
              ActorRef scheduler_actor{};
          };

          struct ControlTicket {
              std::uint64_t nonce{};
          };

          struct GroupRef {
              std::uint64_t runtime{};
              std::uint64_t actor{};
              std::uint64_t generation{};
              std::shared_ptr<ControlTicket> ticket;
          };

          struct Owner {
              std::uint64_t generation{};
              std::uint64_t group{};
              std::shared_ptr<ControlTicket> ticket;
          };

          struct OwnerRegistry {
              std::map<std::pair<std::uint64_t, std::uint64_t>, Owner> live;

              bool adopt(const GroupRef& ref, std::uint64_t group) {
                  return live.emplace(
                      std::make_pair(ref.runtime, ref.actor),
                      Owner{ref.generation, group, ref.ticket}).second;
              }

              bool finalize(const GroupRef& ref, std::uint64_t group) {
                  auto it = live.find({ref.runtime, ref.actor});
                  if (it == live.end()
                      || it->second.generation != ref.generation
                      || it->second.group != group
                      || it->second.ticket != ref.ticket)
                      return false;
                  live.erase(it);
                  return true;
              }
          };

          static std::atomic<std::uint64_t> next_domain{1};

          static std::uint64_t allocate_domain() {
              auto candidate = next_domain.load(std::memory_order_relaxed);
              while (candidate != 0 && candidate != std::numeric_limits<std::uint64_t>::max()) {
                  if (next_domain.compare_exchange_weak(
                          candidate, candidate + 1,
                          std::memory_order_relaxed,
                          std::memory_order_relaxed))
                      return candidate;
              }
              return 0;
          }

          static bool same_actor(ActorRef a, ActorRef b) {
              return a.scheduler_domain != 0
                  && a.scheduler_domain == b.scheduler_domain
                  && a.actor_slot == b.actor_slot
                  && a.generation == b.generation;
          }

          static bool matches_scheduler_incarnation(
                  const Ticket& ticket, Scheduler* scheduler, ActorRef actor) {
              return scheduler != nullptr
                  && ticket.scheduler == scheduler
                  && same_actor(ticket.scheduler_actor, actor)
                  && scheduler->actor_live
                  && scheduler->domain == actor.scheduler_domain;
          }

          static void require(bool value, const char* message) {
              if (!value) {
                  std::cerr << "FAIL: " << message << '\n';
                  std::exit(1);
              }
          }

          int main() {
              next_domain.store(std::numeric_limits<std::uint64_t>::max() - 1,
                                std::memory_order_relaxed);
              const auto final_valid = allocate_domain();
              const auto exhausted = allocate_domain();
              const auto still_exhausted = allocate_domain();
              require(final_valid == std::numeric_limits<std::uint64_t>::max() - 1,
                      "last valid domain was not allocated");
              require(exhausted == 0 && still_exhausted == 0,
                      "scheduler-domain allocator wrapped after exhaustion");

              Scheduler original{41, true};
              Scheduler foreign{42, true};
              ActorRef owner{41, 7, 9};
              ActorRef same_fields{41, 7, 9};
              ActorRef stale_generation{41, 7, 8};
              ActorRef foreign_same_slot_generation{42, 7, 9};
              Ticket exact{&original, owner};

              require(matches_scheduler_incarnation(exact, &original, owner),
                      "exact scheduler incarnation rejected");
              require(matches_scheduler_incarnation(exact, &original, same_fields),
                      "value-equivalent exact native actor ref rejected");
              require(!matches_scheduler_incarnation(exact, &original, stale_generation),
                      "stale generation accepted");
              require(!matches_scheduler_incarnation(exact, &foreign, foreign_same_slot_generation),
                      "foreign scheduler accepted same slot/generation");
              require(!matches_scheduler_incarnation(exact, &foreign, owner),
                      "wrong scheduler pointer accepted original numeric actor");
              original.actor_live = false;
              require(!matches_scheduler_incarnation(exact, &original, owner),
                      "retired actor accepted");

              Scheduler replacement_same_numeric_domain{41, true};
              require(!matches_scheduler_incarnation(
                          exact, &replacement_same_numeric_domain, owner),
                      "replacement scheduler object accepted old opaque ticket");

              Ticket replacement_ticket{&replacement_same_numeric_domain, owner};
              require(matches_scheduler_incarnation(
                          replacement_ticket, &replacement_same_numeric_domain, owner),
                      "fresh replacement ticket rejected");

              OwnerRegistry registry;
              auto first_ticket = std::make_shared<ControlTicket>(ControlTicket{1});
              auto forged_ticket = std::make_shared<ControlTicket>(ControlTicket{2});
              GroupRef first{91, 17, 9, first_ticket};
              GroupRef forged_same_numeric{91, 17, 9, forged_ticket};
              require(registry.adopt(first, 5),
                      "owner registry rejected first incarnation");
              require(!registry.finalize(forged_same_numeric, 5),
                      "same-label same-generation forged ticket retired live owner");
              require(registry.live.size() == 1,
                      "failed forged finalization mutated owner registry");
              require(registry.finalize(first, 5),
                      "exact opaque owner ticket could not finalize");
              require(registry.adopt(forged_same_numeric, 5),
                      "replacement with same numeric identity could not be adopted");
              require(!registry.finalize(first, 5),
                      "stale exact ticket retired replacement incarnation");
              require(registry.live.size() == 1,
                      "stale finalizer erased replacement owner");
              require(registry.finalize(forged_same_numeric, 5),
                      "replacement exact opaque ticket could not finalize");

              std::cout
                  << "NATIVE_IDENTITY_FENCE_MODEL_OK cases=18 private_source_bytes=0\n";
              return 0;
          }
          CPP
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror "$work/model.cpp" -o "$work/model-gcc"
          "$work/model-gcc"
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror "$work/model.cpp" -o "$work/model-clang"
          "$work/model-clang"
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror             -fsanitize=address,undefined -fno-omit-frame-pointer             "$work/model.cpp" -o "$work/model-sanitize"
          "$work/model-sanitize"
          echo "SOURCE_FREE_NATIVE_IDENTITY_PASS compilers=3 private_source_bytes=0"
