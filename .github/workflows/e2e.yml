name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm test

  oreslang-restart-contract:
    if: github.ref == 'refs/heads/synthetic/oreslang-restart-contract-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout synthetic-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'

      - name: Prove no private-source payload path exists
        shell: bash
        run: |
          set -euo pipefail
          test -f synthetic/OreslangRestartContractSynthetic.java
          test -f synthetic/native_done_order.cpp
          test ! -e private-oreslang-source
          test ! -e oreslang-source.java
          test ! -e oreslang-source.llvm
          grep -F 'source-free model; no private Oreslang source copied' synthetic/OreslangRestartContractSynthetic.java
          grep -F 'source-free model; no private Oreslang source copied' synthetic/native_done_order.cpp

      - name: Compile source-free Java contract model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetic-classes
          mkdir synthetic-classes
          javac -d synthetic-classes synthetic/OreslangRestartContractSynthetic.java

      - name: Execute Java restart and policy invariants
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -ea -cp synthetic-classes synthetic.OreslangRestartContractSynthetic)"
          printf '%s\n' "$output"
          grep -F 'SYNTHETIC JAVA CONTRACT: 51/51 invariants passed' <<<"$output"
          grep -F 'JAVA_SOURCE_SHA=6bc6737174e680c17746d77f3ccdd4f5bdb67561' <<<"$output"
          grep -F 'JAVA_SOURCE_TREE=84f6a832c7620a5510aa5747a1e618f18575529a' <<<"$output"
          grep -F 'LLVM_SOURCE_SHA=9e28dcdd855b22fdfadb47978ebfcd2c918f703b' <<<"$output"
          grep -F 'LLVM_SOURCE_TREE=e9bf402f802c0654ab602d1f12be4f10bfa58c50' <<<"$output"

      - name: Compile source-free native DONE model
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          g++ -std=c++20 -O2 -pthread synthetic/native_done_order.cpp -o synthetic-native-done

      - name: Execute native DONE and reincarnation stress
        shell: bash
        run: |
          set -euo pipefail
          output="$(./synthetic-native-done)"
          printf '%s\n' "$output"
          grep -F 'SYNTHETIC NATIVE DONE CONTRACT: 2000/2000 passed' <<<"$output"
          grep -F 'LLVM_SOURCE_SHA=9e28dcdd855b22fdfadb47978ebfcd2c918f703b' <<<"$output"
          grep -F 'LLVM_SOURCE_TREE=e9bf402f802c0654ab602d1f12be4f10bfa58c50' <<<"$output"
          grep -F 'NOTE=source-free model; no private Oreslang source copied' <<<"$output"

      - name: Compile source-free native typed CONTROL model
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -pthread synthetic/native_typed_control.cpp -o synthetic-native-typed-control

      - name: Execute native typed supervisor CONTROL model
        shell: bash
        run: |
          set -euo pipefail
          output="$(./synthetic-native-typed-control)"
          printf '%s\n' "$output"
          grep -F 'SYNTHETIC NATIVE TYPED CONTROL: 8/8 invariants passed' <<<"$output"
          grep -F 'LLVM_SOURCE_SHA=9e28dcdd855b22fdfadb47978ebfcd2c918f703b' <<<"$output"
          grep -F 'LLVM_SOURCE_TREE=e9bf402f802c0654ab602d1f12be4f10bfa58c50' <<<"$output"
          grep -F 'NOTE=source-free model; no private Oreslang source copied' <<<"$output"
