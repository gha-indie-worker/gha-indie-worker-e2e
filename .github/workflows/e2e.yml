name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm test

  mailbox-envelope-release-ownership-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          mkdir -p build/mailbox-envelope-oracle
          javac --release 25 -Xlint:all -Werror -d build/mailbox-envelope-oracle src/test-oracles/MailboxEnvelopeReleaseOwnershipOracle.java
          java -cp build/mailbox-envelope-oracle MailboxEnvelopeReleaseOwnershipOracle
