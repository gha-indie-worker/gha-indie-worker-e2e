name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm test

  select-plan-exact:
    if: github.ref == 'refs/heads/tmp/oreslang-java2048-consume-runtime-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source blob manifest
        working-directory: ci/oreslang-select-1747
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while read -r expected file; do
            if [[ "${expected:0:1}" == "#" || -z "$expected" ]]; then continue; fi
            test "$(git hash-object "$file")" = "$expected"
            n=$((n+1))
          done < source-sha1.txt
          test "$n" -eq 141
          echo "verified $n source blob SHAs"
      - name: Verify hardened compiler and runtime derived blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/oreslang-select-1747/src/main/java/dev/oreslang/runtime/TaskPipeline.java)" = "87be82c4dfbf6231d70aad9197f9fcaf255cd74d"
          test "$(git hash-object ci/oreslang-select-1747/src/main/java/dev/oreslang/types/TypeChecker.java)" = "48e2c81bc1582212c5b12d3352e54f7277a1c05b"
          test "$(git hash-object ci/oreslang-select-1747/src/main/java/dev/oreslang/types/OwnershipChecker.java)" = "5e99a657c3cdb4ad9a1079adf039b47accbc7c30"
          test "$(git hash-object ci/oreslang-select-1747/src/main/java/dev/oreslang/nodes/OresEvalRootNode.java)" = "e9f51ec880f448a1fd5c2576165987f25181c3d2"
          test "$(git hash-object ci/oreslang-select-1747/src/test/java/dev/oreslang/parser/FuturePipelineTypingCheck.java)" = "b29c22efb6d357d4706446143abae20561e70231"
          test "$(git hash-object ci/oreslang-select-1747/src/test/java/dev/oreslang/SourcePureFuturePipelineExecutionTest.java)" = "8971b4084474f4395e5bb6249dbaa911d7042ff1"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          java-version: '25'
          distribution: graalvm
      - name: Exact-head select-plan regression suite
        run: |
          mvn -B -ntp -f ci/oreslang-select-1747/pom.xml \
            -Dtest=SelectLoopDescriptorHoistTest,StaticSelectTicketTest,DynamicSelectPlanGenerationTest,ChannelRuntimeTest,FutureChannelSelectTest,ChannelSelectArmBudgetTest,ChannelPendingAdmissionTest,ChannelFutureSelectQuotaTest,ChannelSelectFairAdmissionRaceTest,FutureSelectAttachmentPublicationBarrierTest,FutureSelectLateDetachBarrierTest,ChannelMappedSelectionCancellationTest,ActorSelectFairnessIsolationTest,SelectPeerFutureAliasReadinessTest,FutureSelectAdditionalRegressionTest,ChannelMappedCancellationStressTest,TaskPipelineTest,FuturePipelineProvenanceTest,SourcePureFuturePipelineExecutionTest test
      - name: Probe consuming Future input ownership
        shell: bash
        run: |
          cat > /tmp/OwnedInputProbe.java <<'JAVA'
          package dev.oreslang.runtime;
          import java.util.List;
          import java.util.concurrent.TimeUnit;
          public final class OwnedInputProbe {
            private static void awaitInput(OresFuture<?> input) throws Exception {
              long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(5);
              while (input.pendingRuntimeWaiterCount() == 0 && System.nanoTime() < deadline) {
                Thread.sleep(2);
              }
              if (input.pendingRuntimeWaiterCount() == 0) throw new AssertionError("no input waiter");
            }
            public static void main(String[] args) throws Exception {
              OresFuture<Integer> owned = new OresFuture<>();
              try (OresScheduler scheduler = new OresScheduler(1)) {
                TaskPipeline.PipelineHandle<Integer> handle =
                    TaskPipeline.startOwnedInCurrentTaskOrRoot(
                        scheduler, owned, List.of(v -> ((Integer) v) + 1));
                awaitInput(owned);
                if (!handle.cancel()) throw new AssertionError("owned cancel lost");
                if (!owned.isCancelled()) throw new AssertionError("owned input survived cancellation");
                if (!handle.result().isCancelled()) throw new AssertionError("result not cancelled");
                if (!(handle.getDone().get(5, TimeUnit.SECONDS) instanceof TaskHandle.Cancelled)) {
                  throw new AssertionError("owned pipeline did not physically retire as cancelled");
                }
              }

              OresFuture<Integer> borrowed = new OresFuture<>();
              try (OresScheduler scheduler = new OresScheduler(1)) {
                TaskPipeline.PipelineHandle<Integer> handle =
                    TaskPipeline.startInCurrentTaskOrRoot(
                        scheduler, borrowed, List.of(v -> ((Integer) v) + 1));
                awaitInput(borrowed);
                if (!handle.cancel()) throw new AssertionError("borrowed cancel lost");
                if (borrowed.isCancelled()) throw new AssertionError("borrowed input was cancelled");
              }

              OresFuture<Integer> rejected = new OresFuture<>();
              OresScheduler closed = new OresScheduler(1);
              closed.close();
              boolean failed = false;
              try {
                TaskPipeline.startOwnedInCurrentTaskOrRoot(closed, rejected, List.of(v -> v));
              } catch (RuntimeException expected) {
                failed = true;
              }
              if (!failed) throw new AssertionError("closed scheduler admitted pipeline");
              if (!rejected.isCancelled()) throw new AssertionError("moved input leaked on admission failure");
              System.out.println("owned-input-probe: ok");
            }
          }
          JAVA
          javac --release 21 -cp ci/oreslang-select-1747/target/classes -d /tmp /tmp/OwnedInputProbe.java
          java -cp ci/oreslang-select-1747/target/classes:/tmp dev.oreslang.runtime.OwnedInputProbe
