name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm test

  select-plan-exact:
    if: github.ref == 'refs/heads/test/oreslang-select-hoist-exact-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source blob manifest
        working-directory: ci/oreslang-select-1747
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while read -r expected file; do
            if [[ "${expected:0:1}" == "#" || -z "$expected" ]]; then continue; fi
            test "$(git hash-object "$file")" = "$expected"
            n=$((n+1))
          done < source-sha1.txt
          test "$n" -eq 130
          echo "verified $n source blob SHAs"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          java-version: '25'
          distribution: graalvm
      - name: Exact-head select-plan regression suite
        run: |
          mvn -B -ntp -f ci/oreslang-select-1747/pom.xml \
            -Dtest=SelectLoopDescriptorHoistTest,StaticSelectTicketTest,DynamicSelectPlanGenerationTest,ChannelRuntimeTest,FutureChannelSelectTest,ChannelSelectArmBudgetTest,ChannelPendingAdmissionTest,ChannelFutureSelectQuotaTest,ChannelSelectFairAdmissionRaceTest,FutureSelectAttachmentPublicationBarrierTest,FutureSelectLateDetachBarrierTest,ChannelMappedSelectionCancellationTest,ActorSelectFairnessIsolationTest,SelectPeerFutureAliasReadinessTest,FutureSelectAdditionalRegressionTest,ChannelMappedCancellationStressTest test
