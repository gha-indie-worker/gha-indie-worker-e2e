name: Atto Java runtime private mailbox host and actor integration
on:
  push:
    branches: [ci/atto-runtime-next-ten-20261127]
permissions: {}
jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Compile exact public candidate and run guest regression
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.java.git
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= fetch --depth=1 origin a1980eb20366b5337419d65ecec1d50f8af15248
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = a1980eb20366b5337419d65ecec1d50f8af15248
          echo "TREE=$(git -C source rev-parse HEAD^{tree})"
          if [ -n "${JAVA_HOME_25_X64:-}" ] && [ -x "$JAVA_HOME_25_X64/bin/java" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            curl -fsSL --retry 3 'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jdk&os=linux&vendor=eclipse' > /tmp/jdk25.json
            link=$(jq -er '.[0].binary.package.link' /tmp/jdk25.json)
            checksum=$(jq -er '.[0].binary.package.checksum' /tmp/jdk25.json)
            [[ "$link" = https://github.com/adoptium/temurin25-binaries/releases/download/* ]]
            [[ "$checksum" =~ ^[a-fA-F0-9]{64}$ ]]
            curl -fsSL --retry 3 "$link" -o /tmp/jdk25.tar.gz
            echo "$checksum  /tmp/jdk25.tar.gz" | sha256sum -c -
            mkdir -p /tmp/atto-jdk25
            tar -xzf /tmp/jdk25.tar.gz --strip-components=1 -C /tmp/atto-jdk25
            export JAVA_HOME=/tmp/atto-jdk25
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          cd source
          test "$(git rev-parse HEAD^{tree})" = af54546ebc75a689d9cfec0e325c15924e47e5cb
          mvn -B -ntp -Dtest=ActorPrivateMailboxChannelTest,ChannelRuntimeTest,ChannelPendingAdmissionTest,NoZalgoCallbackDispatchTest,ActorSharedMailboxAccountingTest -DfailIfNoTests=true test
          for suite in ActorPrivateMailboxChannelTest ChannelRuntimeTest ChannelPendingAdmissionTest NoZalgoCallbackDispatchTest ActorSharedMailboxAccountingTest; do
            report="target/surefire-reports/TEST-dev.oreslang.runtime.$suite.xml"
            test -s "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
            grep -q 'skipped="0"' "$report"
            echo "MAILBOX_SUITE_PASS $suite"
          done
