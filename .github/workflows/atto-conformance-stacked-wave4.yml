    env:
      BASE_SHA: ${{ matrix.base }}
      HEAD_SHA: ${{ matrix.head }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Exact public source integration
        run: |
          git init source
          git -C source remote add origin https://github.com/atto-lang/atto-platform-conformance.git
          git -C source fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git -C source checkout --detach "$BASE_SHA"
          git -C source -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff "$HEAD_SHA"
          echo "BASE=$BASE_SHA HEAD=$HEAD_SHA TREE=$(git -C source write-tree)"
      - name: Execute changed tests
        working-directory: source
        run: |
          mapfile -t tests < <(git diff --cached --name-only --diff-filter=AM | grep -E '\.test\.mjs$' || true)
          if [ "${#tests[@]}" -eq 0 ]; then echo NO_CHANGED_NODE_TESTS; exit 1; fi
          printf '%s\n' "${tests[@]}"
          node --test "${tests[@]}"
