name: Temporary source-free path safety

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-free-path-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: No private Oreslang payload
        shell: bash
        run: |
          set -euo pipefail
          test ! -e private-oreslang-source
          test ! -e oreslang-source.java
          test ! -e oreslang-source.llvm
      - name: Run clean-room path safety model
        shell: python
        run: |
          import os, stat, tempfile, time
          from pathlib import Path

          def secure_open(root, relative):
              parts = relative.split(b"/")
              assert parts and all(p not in (b"", b".", b"..") for p in parts)
              d = os.O_DIRECTORY
              n = os.O_NOFOLLOW
              b = os.O_NONBLOCK
              assert d > 0 and n > 0 and b > 0
              assert not (d & n) and not (d & b) and not (n & b)
              root_fd = os.open(root, os.O_RDONLY | d | n)
              try:
                  dir_fd = root_fd
                  for component in parts[:-1]:
                      nxt = os.open(component, os.O_RDONLY | d | n, dir_fd=dir_fd)
                      if dir_fd != root_fd:
                          os.close(dir_fd)
                      dir_fd = nxt
                  try:
                      fd = os.open(parts[-1], os.O_RDONLY | n | b, dir_fd=dir_fd)
                  finally:
                      if dir_fd != root_fd:
                          os.close(dir_fd)
                  st = os.fstat(fd)
                  if not stat.S_ISREG(st.st_mode):
                      os.close(fd)
                      raise ValueError("not regular")
                  if st.st_nlink != 1:
                      os.close(fd)
                      raise ValueError("hardlink alias")
                  return fd
              finally:
                  os.close(root_fd)

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "root"
              (root / "nested").mkdir(parents=True)
              (root / "nested" / "file").write_text("ok\n")
              (root / "leaf").write_text("ok\n")

              fd = secure_open(root, b"nested/file")
              assert os.read(fd, 8) == b"ok\n"
              os.close(fd)

              alias = Path(tmp) / "alias"
              os.link(root / "leaf", alias)
              try:
                  secure_open(root, b"leaf")
                  raise AssertionError("hardlink admitted")
              except ValueError:
                  pass
              alias.unlink()

              (root / "leaf").unlink()
              os.mkfifo(root / "leaf")
              started = time.monotonic()
              try:
                  secure_open(root, b"leaf")
                  raise AssertionError("FIFO admitted")
              except ValueError:
                  pass
              assert time.monotonic() - started < 1.0

              external = Path(tmp) / "external"
              (root / "nested").rename(external)
              (root / "nested").symlink_to(external, target_is_directory=True)
              try:
                  secure_open(root, b"nested/file")
                  raise AssertionError("parent symlink admitted")
              except OSError:
                  pass

          print("SOURCE_FREE_PATH_SAFETY_OK")
      - name: Scope marker
        run: echo "no_private_source_export=true"
