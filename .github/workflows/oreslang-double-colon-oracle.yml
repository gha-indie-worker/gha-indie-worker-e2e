name: Oreslang double-colon source-free oracle
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run independent syntax oracle
        run: node --test tests/oreslang-double-colon-oracle.mjs
