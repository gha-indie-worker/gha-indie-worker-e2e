name: Oreslang callable syntax v1 exact oracle
on:
  push:
    branches:
      - 'ci/oreslang-common103-as-oracle-20261020'
permissions:
  contents: read
jobs:
  callable-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tmp/common103/fixtures/callable-syntax-v1.json)" = "4e046b034c9e0f37dee37ea3b06ce3e0004be318"
          test "$(git rev-parse HEAD:tmp/common103/tests/test_callable_syntax_v1.py)" = "4561de08d282a52bca8519db2206fe5a3819dda9"
          echo "EXACT_BLOBS_PASS"
      - name: Execute callable syntax oracle
        run: python3 -m unittest discover -s tmp/common103/tests -p 'test_callable_syntax_v1.py' -v
