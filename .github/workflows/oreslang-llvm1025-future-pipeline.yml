name: LLVM1025 Future pipeline ownership exact blobs

on:
  push:
    branches:
      - tmp/oreslang-llvm1025-future-pipe-contract-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact LLVM source blobs
        working-directory: ci/oreslang-llvm1025
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while read -r expected file; do
            if [[ -z "$expected" || "${expected:0:1}" == "#" ]]; then
              continue
            fi
            actual="$(git hash-object "$file")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::expected $expected got $actual"
              exit 1
            fi
            n=$((n+1))
          done < source-sha1.txt
          test "$n" -eq 4
          echo "verified $n exact LLVM source blobs"
      - name: Compile and run with g++
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror             -Ici/oreslang-llvm1025/src/main/cpp             ci/oreslang-llvm1025/tests/future_pipeline_ownership_contract_test.cpp             -o /tmp/future-pipeline-contract-gcc
          /tmp/future-pipeline-contract-gcc
      - name: Compile and run with clang++
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror             -Ici/oreslang-llvm1025/src/main/cpp             ci/oreslang-llvm1025/tests/future_pipeline_ownership_contract_test.cpp             -o /tmp/future-pipeline-contract-clang
          /tmp/future-pipeline-contract-clang

      - name: Clang ASan UBSan contract run
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror             -fsanitize=address,undefined -fno-omit-frame-pointer             -D_GLIBCXX_ASSERTIONS             -Ici/oreslang-llvm1025/src/main/cpp             ci/oreslang-llvm1025/tests/future_pipeline_ownership_contract_test.cpp             -o /tmp/future-pipeline-contract-sanitized
          /tmp/future-pipeline-contract-sanitized
