name: ores-chat embed

on:
  pull_request:
    paths: ["ores-chat-embed/**", ".github/workflows/ores-chat-embed.yml"]
  push:
    branches: [main]
    paths: ["ores-chat-embed/**", ".github/workflows/ores-chat-embed.yml"]
  schedule:
    # The pin guards a live third-party artifact, so re-check it daily even
    # when nothing in this repository changes.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ores-chat-embed
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm test
