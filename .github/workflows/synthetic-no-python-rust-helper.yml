name: Synthetic Rust no-Python helper
on:
  push:
    branches:
      - synthetic/no-python-rust-helper-20261021
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and test Rust helper
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -D warnings --test synthetic/no-python/aot_fixture.rs -o /tmp/aot-fixture-tests
          /tmp/aot-fixture-tests
          rustc --edition=2021 -D warnings synthetic/no-python/aot_fixture.rs -o /tmp/aot-fixture
          rustc --edition=2021 -D warnings --test synthetic/no-python/contract_gate.rs -o /tmp/contract-gate-tests
          /tmp/contract-gate-tests sha256_known_vector
          /tmp/contract-gate-tests sha1_known_vector
          /tmp/contract-gate-tests exact_decimal_arithmetic
          /tmp/contract-gate-tests checked_i64_parser_rejects_overflow
          /tmp/contract-gate-tests parser_rejects_duplicate_keys_and_non_json_constants
          /tmp/contract-gate-tests integration_all_backends
          /tmp/contract-gate-tests integration_adversarial_inputs_fail_closed
          /tmp/contract-gate-tests enum_overlap_exhaustive
          /tmp/contract-gate-tests enum_nominal_boundaries
          rustc --edition=2021 -D warnings synthetic/no-python/contract_gate.rs -o /tmp/contract-gate
          rustc --edition=2021 -D warnings --test synthetic/no-python/scalar_run.rs -o /tmp/scalar-run-tests
          /tmp/scalar-run-tests sha256_vector
          /tmp/scalar-run-tests command_split
          /tmp/scalar-run-tests diagnostics_fail_closed
          /tmp/scalar-run-tests symlink_and_hardlink_rejected
          rustc --edition=2021 -D warnings synthetic/no-python/scalar_run.rs -o /tmp/scalar-run
          rustc --edition=2021 -D warnings --test synthetic/no-python/actor_arena_receipt.rs -o /tmp/arena-receipt-tests
          /tmp/arena-receipt-tests
          rustc --edition=2021 -D warnings synthetic/no-python/actor_arena_receipt.rs -o /tmp/arena-receipt
          rustc --edition=2021 -D warnings --test synthetic/no-python/shared_domain_receipt.rs -o /tmp/shared-domain-receipt-tests
          /tmp/shared-domain-receipt-tests
          rustc --edition=2021 -D warnings synthetic/no-python/shared_domain_receipt.rs -o /tmp/shared-domain-receipt
          mkdir -p /tmp/aot-fixtures
          /tmp/aot-fixture make-negative /tmp/aot-fixtures
          test -s /tmp/aot-fixtures/valid.wasm
          test -s /tmp/aot-fixtures/start.wasm
          cp /tmp/aot-fixtures/valid.wasm /tmp/aot-fixtures/corrupt.wasm
          before="$(sha256sum /tmp/aot-fixtures/corrupt.wasm | cut -d ' ' -f 1)"
          /tmp/aot-fixture corrupt /tmp/aot-fixtures/corrupt.wasm
          after="$(sha256sum /tmp/aot-fixtures/corrupt.wasm | cut -d ' ' -f 1)"
          test "$before" != "$after"
